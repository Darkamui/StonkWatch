services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stonkwatch-web
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__StonkWatch: ${STONKWATCH_DB_CONNECTION_STRING}
      Auth__Google__ClientId: ${STONKWATCH_AUTH_GOOGLE_CLIENT_ID}
      Auth__Google__ClientSecret: ${STONKWATCH_AUTH_GOOGLE_CLIENT_SECRET}
      Auth__AllowedEmail: ${STONKWATCH_AUTH_ALLOWED_EMAIL}
      Auth__ApiKey: ${STONKWATCH_API_KEY}
      DataProtectionKeysPath: /keys
      # Price monitoring. Off unless STONKWATCH_MONITORING_ENABLED is true, in which case
      # the MarketData and Smtp settings below are validated at startup.
      Monitoring__Enabled: ${STONKWATCH_MONITORING_ENABLED:-false}
      Monitoring__IntervalMinutes: ${STONKWATCH_MONITORING_INTERVAL_MINUTES:-15}
      MarketData__ApiKey: ${STONKWATCH_MARKETDATA_APIKEY:-}
      Smtp__Host: ${STONKWATCH_SMTP_HOST:-}
      Smtp__Port: ${STONKWATCH_SMTP_PORT:-587}
      Smtp__Username: ${STONKWATCH_SMTP_USERNAME:-}
      Smtp__Password: ${STONKWATCH_SMTP_PASSWORD:-}
      Smtp__From: ${STONKWATCH_SMTP_FROM:-}
      Smtp__To: ${STONKWATCH_SMTP_TO:-}
      App__PublicBaseUrl: ${STONKWATCH_PUBLIC_BASE_URL:-}
    ports:
      - "8080:8080"
    volumes:
      - stonkwatch-keys:/keys
    # If Postgres runs in its own docker-compose stack on this VPS, attach this service to that
    # stack's network instead of (or in addition to) publishing a port, and point
    # STONKWATCH_DB_CONNECTION_STRING at the Postgres container's service name as Host=.
    # networks:
    #   - postgres_default

volumes:
  stonkwatch-keys:

# networks:
#   postgres_default:
#     external: true
